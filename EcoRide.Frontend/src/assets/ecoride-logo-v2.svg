<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" width="620" height="200">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3CB371"/>
      <stop offset="100%" style="stop-color:#2E8B57"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#66BB6A"/>
      <stop offset="100%" style="stop-color:#388E3C"/>
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1A2E1A"/>
      <stop offset="100%" style="stop-color:#2D4A2D"/>
    </linearGradient>
    <linearGradient id="skinTone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE0B2"/>
      <stop offset="100%" style="stop-color:#FFCC80"/>
    </linearGradient>
    <linearGradient id="skinTone2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D7CCC8"/>
      <stop offset="100%" style="stop-color:#BCAAA4"/>
    </linearGradient>
  </defs>

  <!-- ═══ ICON PART ═══ -->
  <g transform="translate(24, 22)">
    
    <!-- Ombre douce -->
    <ellipse cx="76" cy="148" rx="62" ry="9" fill="#3CB371" opacity="0.12"/>

    <!-- ══ VOITURE ══ -->
    <!-- Corps principal -->
    <rect x="14" y="82" rx="14" ry="14" width="124" height="42" fill="url(#greenGrad)"/>
    
    <!-- Toit / cabine -->
    <path d="M34 82 C34 82, 42 36, 76 32 C110 28, 120 42, 124 60 L128 78 C128 78, 130 82, 128 84 L24 84 C22 84, 22 82, 24 80 Z" 
          fill="url(#greenGrad)"/>
    
    <!-- Pare-brise -->
    <path d="M44 80 C44 80, 50 44, 76 40 C102 36, 112 48, 116 66 L118 80 Z" 
          fill="white" opacity="0.3"/>
    
    <!-- Montant central vitre -->
    <line x1="80" y1="42" x2="80" y2="80" stroke="#2E8B57" stroke-width="2.5" opacity="0.5"/>

    <!-- ══ PASSAGERS HEUREUX ══ -->

    <!-- Passager gauche (femme) -->
    <g transform="translate(58, 48)">
      <!-- Tête -->
      <circle cx="0" cy="0" r="8" fill="url(#skinTone)"/>
      <!-- Cheveux longs -->
      <path d="M-8 -2 C-8 -8, -4 -10, 0 -10 C4 -10, 8 -8, 8 -2 L8 2 C6 0, 4 -6, 0 -7 C-4 -6, -6 0, -8 2 Z" fill="#5D4037"/>
      <path d="M-8 -1 C-9 4, -9 10, -7 14" stroke="#5D4037" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M8 -1 C9 4, 9 10, 7 14" stroke="#5D4037" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- Yeux joyeux (fermés, sourire) -->
      <path d="M-3 -1 C-3 -2.5, -1 -2.5, -1 -1" stroke="#4E342E" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      <path d="M1 -1 C1 -2.5, 3 -2.5, 3 -1" stroke="#4E342E" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      <!-- Grand sourire -->
      <path d="M-3 2.5 C-1 5.5, 1 5.5, 3 2.5" stroke="#D84315" stroke-width="1.3" fill="none" stroke-linecap="round"/>
      <!-- Joues roses -->
      <circle cx="-5" cy="1.5" r="2" fill="#FF8A80" opacity="0.35"/>
      <circle cx="5" cy="1.5" r="2" fill="#FF8A80" opacity="0.35"/>
      <!-- Corps / épaules -->
      <path d="M-8 18 C-8 12, -5 8, 0 8 C5 8, 8 12, 8 18" fill="url(#skinTone)" opacity="0.5"/>
      <!-- Main qui fait coucou -->
      <g transform="translate(10, -6)">
        <circle cx="0" cy="0" r="3.5" fill="url(#skinTone)"/>
        <!-- Doigts écartés -->
        <line x1="-1.5" y1="-3" x2="-2.5" y2="-7" stroke="#FFCC80" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="0" y1="-3.5" x2="0" y2="-8" stroke="#FFCC80" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="1.5" y1="-3" x2="2.5" y2="-7" stroke="#FFCC80" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="3" y1="-1.5" x2="5" y2="-4" stroke="#FFCC80" stroke-width="1.3" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Passager centre (conducteur) -->
    <g transform="translate(80, 46)">
      <!-- Tête -->
      <circle cx="0" cy="0" r="9" fill="url(#skinTone2)"/>
      <!-- Cheveux courts -->
      <path d="M-9 -2 C-9 -8, -5 -12, 0 -12 C5 -12, 9 -8, 9 -2 L8 0 C7 -4, 4 -8, 0 -8 C-4 -8, -7 -4, -8 0 Z" fill="#37474F"/>
      <!-- Yeux joyeux -->
      <path d="M-4 -1 C-4 -3, -1.5 -3, -1.5 -1" stroke="#37474F" stroke-width="1.3" fill="none" stroke-linecap="round"/>
      <path d="M1.5 -1 C1.5 -3, 4 -3, 4 -1" stroke="#37474F" stroke-width="1.3" fill="none" stroke-linecap="round"/>
      <!-- Sourire -->
      <path d="M-3.5 3 C-1.5 6.5, 1.5 6.5, 3.5 3" stroke="#D84315" stroke-width="1.3" fill="none" stroke-linecap="round"/>
      <!-- Joues -->
      <circle cx="-6" cy="2" r="2.2" fill="#FF8A80" opacity="0.3"/>
      <circle cx="6" cy="2" r="2.2" fill="#FF8A80" opacity="0.3"/>
      <!-- Corps -->
      <path d="M-9 20 C-9 13, -6 9, 0 9 C6 9, 9 13, 9 20" fill="url(#skinTone2)" opacity="0.4"/>
    </g>

    <!-- Passager droit (personne) -->
    <g transform="translate(100, 50)">
      <!-- Tête -->
      <circle cx="0" cy="0" r="7.5" fill="url(#skinTone)"/>
      <!-- Cheveux -->
      <path d="M-7.5 -1 C-7.5 -7, -4 -9.5, 0 -9.5 C4 -9.5, 7.5 -7, 7.5 -1 L6.5 1 C5.5 -3, 3 -6, 0 -6.5 C-3 -6, -5.5 -3, -6.5 1 Z" fill="#8D6E63"/>
      <!-- Yeux joyeux -->
      <path d="M-3 -0.5 C-3 -2, -1 -2, -1 -0.5" stroke="#4E342E" stroke-width="1.1" fill="none" stroke-linecap="round"/>
      <path d="M1 -0.5 C1 -2, 3 -2, 3 -0.5" stroke="#4E342E" stroke-width="1.1" fill="none" stroke-linecap="round"/>
      <!-- Sourire -->
      <path d="M-2.5 2 C-1 4.5, 1 4.5, 2.5 2" stroke="#D84315" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      <!-- Joues -->
      <circle cx="-4.5" cy="1" r="1.8" fill="#FF8A80" opacity="0.35"/>
      <circle cx="4.5" cy="1" r="1.8" fill="#FF8A80" opacity="0.35"/>
      <!-- Pouce levé -->
      <g transform="translate(-9, -4)">
        <circle cx="0" cy="0" r="3" fill="url(#skinTone)"/>
        <line x1="0" y1="-3" x2="0" y2="-8" stroke="#FFCC80" stroke-width="2.2" stroke-linecap="round"/>
      </g>
      <!-- Corps -->
      <path d="M-7 16 C-7 11, -4.5 7.5, 0 7.5 C4.5 7.5, 7 11, 7 16" fill="url(#skinTone)" opacity="0.4"/>
    </g>

    <!-- Phare avant -->
    <ellipse cx="132" cy="90" rx="6" ry="5" fill="white" opacity="0.8"/>
    <ellipse cx="132" cy="90" rx="3" ry="2.5" fill="#FFF9C4" opacity="0.6"/>
    
    <!-- Phare arrière -->
    <rect x="14" y="90" rx="3" ry="3" width="6" height="6" fill="#FF7043" opacity="0.6"/>

    <!-- Jupe basse -->
    <rect x="20" y="120" rx="4" ry="4" width="112" height="5" fill="#2E8B57" opacity="0.35"/>

    <!-- Roue arrière -->
    <circle cx="42" cy="126" r="16" fill="#263238"/>
    <circle cx="42" cy="126" r="10.5" fill="#455A64"/>
    <circle cx="42" cy="126" r="4.5" fill="#78909C"/>
    <!-- Jante -->
    <line x1="42" y1="118" x2="42" y2="122" stroke="#90A4AE" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="35" y1="123" x2="38" y2="125" stroke="#90A4AE" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="35" y1="130" x2="38" y2="128" stroke="#90A4AE" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="46" y1="125" x2="49" y2="123" stroke="#90A4AE" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="46" y1="128" x2="49" y2="130" stroke="#90A4AE" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Roue avant -->
    <circle cx="110" cy="126" r="16" fill="#263238"/>
    <circle cx="110" cy="126" r="10.5" fill="#455A64"/>
    <circle cx="110" cy="126" r="4.5" fill="#78909C"/>
    <line x1="110" y1="118" x2="110" y2="122" stroke="#90A4AE" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="103" y1="123" x2="106" y2="125" stroke="#90A4AE" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="103" y1="130" x2="106" y2="128" stroke="#90A4AE" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="114" y1="125" x2="117" y2="123" stroke="#90A4AE" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="114" y1="128" x2="117" y2="130" stroke="#90A4AE" stroke-width="1.5" stroke-linecap="round"/>

    <!-- ═══ FEUILLE ═══ -->
    <g transform="translate(104, 20)">
      <path d="M0 16 C0 16, 6 -6, 22 2 C22 2, 10 2, 6 16" fill="url(#leafGrad)"/>
      <path d="M6 16 C8 8, 14 4, 22 2" stroke="#2E7D32" stroke-width="1" fill="none" opacity="0.5"/>
      <path d="M2 14 C2 14, -3 4, 10 4 C10 4, 3 6, 2 14" fill="#81C784" opacity="0.7"/>
      <!-- Petite feuille supplémentaire -->
      <path d="M16 8 C16 8, 20 2, 26 6 C26 6, 20 5, 18 10" fill="#A5D6A7" opacity="0.6"/>
    </g>

    <!-- Lignes de mouvement -->
    <line x1="0" y1="92" x2="10" y2="92" stroke="#3CB371" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
    <line x1="-4" y1="100" x2="8" y2="100" stroke="#3CB371" stroke-width="2" stroke-linecap="round" opacity="0.2"/>
    <line x1="2" y1="108" x2="11" y2="108" stroke="#3CB371" stroke-width="1.8" stroke-linecap="round" opacity="0.15"/>

    <!-- Petites étoiles / étincelles de bonheur autour de la voiture -->
    <g opacity="0.4">
      <text x="30" y="26" font-size="10" fill="#FFD54F">✦</text>
      <text x="120" y="18" font-size="8" fill="#81C784">✦</text>
      <text x="140" y="70" font-size="7" fill="#FFD54F">✦</text>
      <text x="14" y="54" font-size="9" fill="#81C784">✦</text>
    </g>

  </g>

  <!-- ═══ TEXTE ═══ -->
  <g transform="translate(190, 72)">
    <text font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="74" fill="url(#greenGrad)" letter-spacing="-2">
      Eco
    </text>
    <text x="138" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="74" fill="url(#darkGrad)" letter-spacing="-2">
      Ride
    </text>
  </g>

  <!-- Tagline -->
  <text x="195" y="108" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="14" fill="#5F7A5F" letter-spacing="3.5">
    COVOITURAGE ÉCO-RESPONSABLE
  </text>

  <!-- Trait déco -->
  <rect x="195" y="118" width="50" height="2.5" rx="1.25" fill="url(#greenGrad)" opacity="0.5"/>

</svg>
